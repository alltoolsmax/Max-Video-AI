name: Build Max AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Bản phát hành tag v<phiên bản> (lấy từ package.json): bản nháp tới khi đủ Windows + macOS, rồi mới công bố (latest).
# Tệp TÊN CỐ ĐỊNH – link .../releases/latest/download/<tên> không bao giờ đổi:
#   max_ai_mrhuynh_win.zip (khách cài lần đầu) · max_ai_mrhuynh_win.exe + max_win.json (trang quản trị › Max AI › Cập nhật phần mềm)
#   max_ai_mrhuynh_mac.zip (khách cài lần đầu, 2 bộ cài) · max_ai_mrhuynh_mac_apple.dmg / _intel.dmg + max_mac.json (máy Mac tự cập nhật)
# Muốn khách nhận bản mới: tăng "version" trong package.json → push → đợi build xong → trang quản trị › Phát hành.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
          - os: macos-15-intel
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        if: matrix.name == 'win'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          node tools/make-downloads.js
      - name: Build macOS
        if: matrix.name == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg --x64 --arm64 --publish never
          VER=$(node -p "require('./package.json').version")
          node tools/make-downloads.js --mac "dist/MaxAI-$VER-arm64.dmg" "dist/MaxAI-$VER-x64.dmg"
      - name: Đưa lên Releases (bản nháp)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Max AI $TAG" \
              --notes "Windows: max_ai_mrhuynh_win.zip (khách cài lần đầu). macOS: max_ai_mrhuynh_mac.zip (2 bộ cài chip Apple M + Intel)." \
              --target "${{ github.sha }}" || sleep 10
          if [ "${{ matrix.name }}" = "win" ]; then D=dist/downloads; else D=dist/downloads-mac; fi
          gh release upload "$TAG" $D/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Công bố bản mới (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release edit "v$VER" --draft=false --latest
