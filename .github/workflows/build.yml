name: Build Max AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Bản phát hành tag v<phiên bản> (lấy từ package.json): bản nháp tới khi đủ Windows + macOS, rồi mới công bố (latest).
# Tệp TÊN CỐ ĐỊNH – link .../releases/latest/download/<tên> không bao giờ đổi:
#   max_ai_mrhuynh_win.zip (khách cài lần đầu) · max_ai_mrhuynh_win.exe + max_win.json (trang quản trị › Max AI › Cập nhật phần mềm)
#   max_ai_mrhuynh_mac.zip (khách cài lần đầu, 2 bộ cài) · max_ai_mrhuynh_mac_apple.dmg / _intel.dmg + max_mac.json (máy Mac tự cập nhật)
# Muốn khách nhận bản mới: tăng "version" trong package.json → push → đợi build xong → trang quản trị › Phát hành.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
          - os: macos-15-intel
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        if: matrix.name == 'win'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          node tools/make-downloads.js
      - name: Build macOS
        if: matrix.name == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg --x64 --arm64 --publish never
          VER=$(node -p "require('./package.json').version")
          node tools/make-downloads.js --mac "dist/MaxAI-$VER-arm64.dmg" "dist/MaxAI-$VER-x64.dmg"
      - name: Thử mở app trên macOS Intel (chụp màn hình + nhật ký)
        if: matrix.name == 'mac'
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac/*.app | head -1)
          echo "App: $APP"; sw_vers; uname -m
          codesign -dv "$APP" 2>&1 | head -8; codesign --verify --deep --strict "$APP" && echo "codesign OK"
          spctl -a -vv "$APP" 2>&1 || true
          MAXAI_SMOKE="$PWD/smoke-mac.png" "$APP/Contents/MacOS/Max AI" > smoke-mac.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do [ -f smoke-mac.png ] && break; sleep 2; done
          kill $PID 2>/dev/null || true
          cat smoke-mac.log
          ls "$HOME/Library/Logs/Max AI" 2>/dev/null && cat "$HOME/Library/Logs/Max AI/main.log"
          ps aux | grep -i "max ai" | grep -v grep || true
          test -f smoke-mac.png
      - name: Lưu kết quả thử
        if: matrix.name == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mac
          path: |
            smoke-mac.png
            smoke-mac.log
          if-no-files-found: ignore
      - name: Đưa lên Releases (bản nháp)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          NOTES="Windows: max_ai_mrhuynh_win.zip (khách cài lần đầu). macOS: max_ai_mrhuynh_mac.zip (2 bộ cài chip Apple M + Intel)."
          # Tạo tag trước (nếu chưa có), rồi tạo bản phát hành — thử lại nhiều lần khi GitHub lỗi tạm thời (HTTP 5xx)
          git tag "$TAG" "${{ github.sha }}" 2>/dev/null && git push origin "$TAG" 2>/dev/null || true
          for i in 1 2 3 4 5 6 7 8; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --draft --title "Max AI $TAG" --notes "$NOTES" --verify-tag && break
            echo "Tạo bản phát hành lỗi, thử lại lần $i sau $((i * 20)) giây…"; sleep $((i * 20))
          done
          gh release view "$TAG" >/dev/null
          if [ "${{ matrix.name }}" = "win" ]; then D=dist/downloads; else D=dist/downloads-mac; fi
          for i in 1 2 3 4 5; do gh release upload "$TAG" $D/* --clobber && break; echo "Tải lên lỗi, thử lại…"; sleep $((i * 20)); done

  # Chế độ nhẹ + Chất lượng cao: kiểm tra workflow Wan 2.2 5B và LTX-2.3 với ComfyUI thật (CPU, mô hình rỗng — chỉ kiểm tra node & tham số)
  lite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài ComfyUI (bản cố định) + PyTorch CPU
        run: |
          C=$(node -p "require('./src/main/lite').COMFY.commit")
          curl -sL "https://github.com/comfy-org/ComfyUI/archive/$C.zip" -o comfy.zip
          unzip -q comfy.zip && mv ComfyUI-$C comfy
          pip install -q torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r comfy/requirements.txt
          mkdir -p comfy/models/diffusion_models comfy/models/text_encoders comfy/models/vae comfy/models/checkpoints comfy/models/loras comfy/models/latent_upscale_models comfy/input/maxai
          touch comfy/models/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors comfy/models/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors comfy/models/vae/wan2.2_vae.safetensors
          node -e "for (const m of require('./src/main/lite').LTX_MODELS) require('fs').writeFileSync('comfy/models/' + m.dir + '/' + m.file, '')"
          python -c "from PIL import Image; Image.new('RGB',(64,64),'red').save('comfy/input/maxai/start.png')"
      - name: Gửi workflow chế độ nhẹ
        run: |
          (cd comfy && python main.py --cpu --listen 127.0.0.1 --port 8188 > ../comfy.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8188/system_stats >/dev/null && break; sleep 2; done
          node tools/lite-check.js http://127.0.0.1:8188 || (tail -50 comfy.log; exit 1)

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Công bố bản mới (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5; do gh release edit "v$VER" --draft=false --latest && break; sleep $((i * 20)); done
